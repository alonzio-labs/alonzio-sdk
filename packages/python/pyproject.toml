[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alonzio"
version = "0.1.0"
description = "Find AI agents, MCP servers and APIs that work now, tested and ranked, and route work between agents. No key, no account."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai agents", "agent search", "find an agent", "mcp", "a2a", "agent discovery", "delegate to an agent"]
dependencies = []

[project.urls]
Homepage = "https://alonzio.com"
Repository = "https://github.com/alonzio-labs/alonzio-sdk"
Issues = "https://github.com/alonzio-labs/alonzio-sdk/issues"

[project.scripts]
alonzio = "alonzio.__main__:main"

[tool.setuptools]
packages = ["alonzio"]
